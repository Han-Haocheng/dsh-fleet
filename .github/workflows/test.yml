name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: node --check index.js
      - run: node --check client.js
      # Pass the files, not the directory. Node 20 expands `test/` (and also
      # picks up test/helpers.js, since it counts every file under a `test`
      # directory), while Node 22 treats the directory as a module to import
      # and fails with "Cannot find module .../test". The shell glob is the
      # only form that behaves the same on both.
      - run: node --test test/*.test.js
